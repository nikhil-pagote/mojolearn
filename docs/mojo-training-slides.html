    // ============================== SESSION 6 ==============================
    { type: "divider", session: 6, title: "Advanced Topics",
      blurb: "Nine chapters from the standard Mojo course outline: documentation, compile-time parameters, memory and pointers, metaprogramming, advanced functions, modules and packages, and interop with C, MLIR, and the GPU.",
      topics: ["docs", "parameters", "memory & pointers", "metaprogramming", "advanced functions", "modules & packages", "C interop", "MLIR interop", "GPU"] },

    { type: "topic", session: 6, id: "toc-documenting", kicker: "session 6 · documenting your code", title: "Docstrings and mojo doc",
      lede: "A docstring is a triple-quoted string placed as the very first statement inside a function (or at the top of a file, for module-level docs). The mojo doc tool can then generate reference documentation directly from it — no separate doc-comment syntax to learn.",
      code: "def my_function(text: String):\n" +
            "    \"\"\"\n" +
            "    This is a docstring summary.\n" +
            "    A second line can add more detail.\n" +
            "    \"\"\"\n" +
            "    print(text)\n\n" +
            "my_function(\"Hello World!\")\n\n" +
            "# generate documentation from the docstrings in a file:\n" +
            "# pixi run mojo doc my_file.mojo",
      output: "Hello World!",
      note: { tone: "verified", label: "note", text: "The first sentence of a docstring is treated as its one-line summary." } },

    { type: "topic", session: 6, id: "toc-parameters", kicker: "session 6 · parameters & compile-time programming", title: "Parameters go further than generics",
      lede: "Sessions 1–5 already used square-bracket parameters for generics (T: Greet). The fuller picture: parentheses always mean \u201csupply this at runtime,\u201d square brackets always mean \u201cresolve this at compile time\u201d — and a parameter can be a type, a value, or even a Bool.",
      code: "def add[cond: Bool](a: Int, b: Int) -> Int:\n" +
            "    return a + b if cond else 0\n\n" +
            "print(add[True](3, 4))     # cond is baked in at compile time\n\n" +
            "struct MyStruct[T: Intable]:\n" +
            "    var value: Int\n\n" +
            "    def __init__(out self, value: T):\n" +
            "        self.value = Int(value)",
      output: "7",
      note: { tone: "verified", label: "note", text: "cond: Bool as a compile-time parameter, and where clauses that constrain parameter values (e.g. where value >= 0), go beyond the T: Trait generics shown in Session 4." } },

    { type: "topic", session: 6, id: "toc-memory", kicker: "session 6 · memory, references & pointers", title: "Beyond ^ : explicit borrowing and raw pointers",
      lede: "Session 5 covered ^ (transfer) and plain assignment (copy). The fuller ownership model adds explicit borrowing conventions on function parameters, plus pointer types for manual memory control when you need it.",
      code: "def take_owned(b: String):      # b^ at the call site transfers b in\n" +
            "    print(b)\n\n" +
            "def take_borrowed(c: String):   # no ^ — reads c without taking it\n" +
            "    print(c)\n\n" +
            "var s = \"hello\"\n" +
            "take_borrowed(s)     # s is still valid afterward\n" +
            "take_owned(s^)       # s is no longer valid afterward\n\n" +
            "from std.memory.alloc import unsafe_alloc\n\n" +
            "var p = unsafe_alloc[Int](1)   # manual heap allocation\n" +
            "p.unsafe_write(10)\n" +
            "print(p[])\n" +
            "p.unsafe_deinit_pointee()\n" +
            "p.unsafe_free()",
      output: "hello\nhello\n10",
      note: { tone: "changed", label: "changed in 1.0.0", text: "The b2 form (UnsafePointer[Int].alloc(1), .init_pointee_copy(), .destroy_pointee(), .free()) no longer compiles: UnsafePointer collapsed into a deprecated alias for Pointer, which has no .alloc at all — allocation moved to the free function unsafe_alloc (from std.memory.alloc), and the pointee methods gained an unsafe_ prefix. p[] with no offset still works unchanged. Verified clean (no warnings) against this build. UnsafePointer/Pointer are otherwise exactly what they sound like — no bounds checking, no automatic cleanup. ArcPointer offers reference-counted shared ownership for when a single owner isn't enough." } },

    { type: "topic", session: 6, id: "toc-metaprogramming", kicker: "session 6 · metaprogramming", title: "Compile-time code that inspects code",
      lede: "Where Session 4's generics check \u201cdoes this type implement this trait,\u201d metaprogramming can branch on that answer at compile time and produce different code paths per type — with zero runtime cost, since the branch never exists in the compiled output.",
      code: "def multiply(first: Scalar, second: type_of(first)) -> type_of(first):\n" +
            "    return first * second\n\n" +
            "def ability[T: Animal](x: T):\n" +
            "    if conforms_to[T, CanFly]():    # resolved at compile time\n" +
            "        print(\"it can fly\")",
      note: { tone: "verified", label: "note", text: "type_of(first) and conforms_to[T, Trait]() go past Session 4's generics into full compile-time reflection and conditional trait conformance." } },

    { type: "topic", session: 6, id: "toc-advanced-functions", kicker: "session 6 · advanced usage of functions", title: "Variadics and overload resolution",
      lede: "Session 2 covered fixed parameter lists with defaults. Functions can also accept a variable number of positional or keyword arguments, and overloads are resolved by argument and parameter types — never by return type alone.",
      code: "def add_all(*args: Int) -> Int:\n" +
            "    var total = 0\n" +
            "    for a in args:\n" +
            "        total += a\n" +
            "    return total\n\n" +
            "print(add_all(1, 2, 3, 4))    # variadic — any number of Int arguments\n\n" +
            "def add(a: Int, b: Int) -> Int:\n" +
            "    return a + b\n\n" +
            "def add(a: Int, b: Bool) -> Int:      # overload — resolved by argument type\n" +
            "    return a + 2 if b else a",
      output: "10",
      note: { tone: "verified", label: "note", text: "Two overloads that differ only in return type are rejected — Mojo resolves overloads strictly by argument and parameter types, never by what the caller does with the result." } },

    { type: "topic", session: 6, id: "toc-modules", kicker: "session 6 · modules & packages", title: "Modules are files, packages are directories",
      lede: "A module is just a .mojo file, imported by its filename. A package is a directory containing an __init__.mojo (even an empty one), which makes the whole directory importable as a single unit.",
      code: "# my_module.mojo\n" +
            "def print_module_message():\n" +
            "    print(\"hello from my_module\")\n\n" +
            "# main.mojo\n" +
            "import my_module\n" +
            "my_module.print_module_message()\n\n" +
            "# mypackage/__init__.mojo (can be empty, or re-export selectively)\n" +
            "from .inner_module import print_packaged_message\n\n" +
            "# main.mojo\n" +
            "import mypackage\n" +
            "mypackage.print_packaged_message()",
      note: { tone: "verified", label: "note", text: "pixi run mojo package mypackage compiles a package to a distributable form that hides its source — relevant once code grows past single-file exercises like this repo's." } },

    { type: "topic", session: 6, id: "toc-c-interop", kicker: "session 6 · C interoperability", title: "Calling C, and being called from C",
      lede: "Mojo can call into C directly through its foreign-function interface — either standard C library functions by name, or functions loaded dynamically from a shared library at runtime — and a Mojo function can be exported for C code to call back.",
      code: "from std.ffi import c_int, external_call\n\n" +
            "var r = external_call[\"rand\", c_int]()    # calls libc's rand() directly\n\n" +
            "var lib = OwnedDLHandle(\"./libmymath.so\")\n" +
            "var mul = lib.get_function[def(c_int, c_int) -> c_int](\"mul\")\n" +
            "print(mul(5, 10))\n\n" +
            "@export\n" +
            "def add(a: Int32, b: Int32) -> Int32:      # callable FROM C\n" +
            "    return a + b\n" +
            "# compiled with: mojo build --emit object add.mojo",
      note: { tone: "verified", label: "note", text: "external_call reaches existing C functions; @export makes a Mojo function callable from C code." } },

    { type: "topic", session: 6, id: "toc-mlir", kicker: "session 6 · MLIR interoperability", title: "Dropping down to the compiler's own IR",
      lede: "Mojo's compiler is itself built on MLIR (Multi-Level Intermediate Representation) rather than a custom IR — and it exposes that layer directly, letting code drop to raw MLIR types and operations when nothing higher-level fits.",
      code: "# a raw MLIR type used in place of a Mojo type\n" +
            "var bits: __mlir_type.i1\n\n" +
            "# a raw MLIR operation invoked directly\n" +
            "var idx = __mlir_op.`index.castu`[_type=__mlir_type.index](value)",
      note: { tone: "verified", label: "note", text: "This is the escape hatch beneath the whole language — for systems programmers doing bit-level or hardware-specific work that Mojo's normal types don't expose." } },

    { type: "topic", session: 6, id: "toc-gpu", kicker: "session 6 · GPU programming", title: "The same language, running on the GPU",
      lede: "Mojo's headline differentiator: the same language used for Session 1's hello-world can also write GPU kernels — functions that run in parallel across thousands of GPU threads, organized into blocks and grids, without switching to CUDA or a separate shading language.",
      code: "def add_two(result: UnsafePointer[Float32], a: UnsafePointer[Float32], b: UnsafePointer[Float32]):\n" +
            "    var i = block_idx.x * block_dim.x + thread_idx.x   # this thread's index\n" +
            "    result[i] = a[i] + b[i]\n\n" +
            "with DeviceContext() as ctx:\n" +
            "    var compiled = ctx.compile_function[add_two]()\n" +
            "    ctx.enqueue_function(compiled, result_buf, a_buf, b_buf, grid_dim=8, block_dim=8)\n" +
            "    ctx.synchronize()",
      note: { tone: "changed", label: "changed in 1.0.0", text: "thread_idx/block_idx identify which of the thousands of parallel invocations is currently running — the same kernel body executes once per GPU thread. Also: UnsafePointer above is deprecated in favour of Pointer (same compiler warning as the earlier memory slide). This snippet was never run in this repo (no GPU in the devcontainer), so it's illustrative only — untested either way, before or after 1.0.0." } },

  function noteHTML(note) {
    if (!note) return "";

  function renderAgenda() {
    // Sort by where each chapter actually sits in THIS deck (session order),
    // not by ruhati.net's chapter numbering -- the two don't match, since
    // this deck regroups topics into its own 6-session flow. The original
    // chapter number is kept as a small "ch. NN" reference tag, not the sort key.
    var resolved = TOC.map(function (item) {
      return { item: item, idx: idIndex[item.target] };
    }).filter(function (r) {
      return r.idx !== undefined;
    }).sort(function (a, b) {
      return a.idx - b.idx;
    });

    var rows = resolved.map(function (r, pos) {
      var item = r.item, idx = r.idx;
      var tag = "session " + SLIDES[idx].session + " \u00b7 ch. " + String(item.n).padStart(2, "0");

        '<div class="toc-tag">' + tag + "</div></div>";
    }).join("");

      '<div class="toc-list">' + rows + "</div>";

  function render() {
    var s = SLIDES[idx];
    var el = document.createElement("div");
    el.className = "slide";
    if (s.type === "cover" || s.type === "divider") el.classList.add("hero");
    var html = "";
    if (s.type === "cover") html = renderCover(s);
    else if (s.type === "agenda") html = renderAgenda();
    else if (s.type === "divider") html = renderDivider(s);
    else if (s.type === "compare") html = renderCompare(s);
    else if (s.type === "table") html = renderTable(s);
    else if (s.type === "closing") html = renderClosing(s);
    else html = renderTopic(s);
    el.innerHTML = html;

    var old = stage.querySelector(".slide");
    if (old) old.remove();
    stage.insertBefore(el, stage.firstChild);

    progressFill.style.width = ((idx + 1) / SLIDES.length * 100) + "%";
    counterEl.textContent = String(idx + 1).padStart(3, "0") + " / " + String(SLIDES.length).padStart(3, "0");
    var sess = s.session ? SESSIONS[s.session - 1] : null;
    sessionLabelEl.textContent = sess ? ("session " + sess.n + " — " + sess.title) : "";
    el.scrollTop = 0;
  }

  function go(n) {
    idx = Math.max(0, Math.min(SLIDES.length - 1, n));
    render();
  }
  function next() { go(idx + 1); }
  function prev() { go(idx - 1); }

  document.getElementById("zoneLeft").addEventListener("click", prev);
  document.getElementById("zoneRight").addEventListener("click", next);

  function tocRowFor(el) {
    while (el && el !== stage) {
      if (el.classList && el.classList.contains("toc-row")) return el;
      el = el.parentNode;
    }
    return null;
  }
  stage.addEventListener("click", function (e) {
    var row = tocRowFor(e.target);
    if (row && row.getAttribute("data-target") !== null) go(parseInt(row.getAttribute("data-target"), 10));
  });
  stage.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var row = tocRowFor(e.target);
    if (row && row.getAttribute("data-target") !== null) {
      e.preventDefault();
      e.stopPropagation();
      go(parseInt(row.getAttribute("data-target"), 10));
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); next(); }
    else if (e.key === "ArrowLeft" || e.key === "ArrowUp" || e.key === "PageUp") { e.preventDefault(); prev(); }
    else if (e.key === "Home") { e.preventDefault(); go(0); }
    else if (e.key === "End") { e.preventDefault(); go(SLIDES.length - 1); }
    else if (e.key === "0") { go(0); }
    else if (/^[1-6]$/.test(e.key) && sessionJump[+e.key] !== undefined) { go(sessionJump[+e.key]); }
  });

  // ---- theme toggle ----
  var themeBtn = document.getElementById("themeBtn");
  function applyStoredTheme() {
    var t = null;
    try { t = localStorage.getItem("mojo-deck-theme"); } catch (err) {}
    if (t) document.documentElement.setAttribute("data-theme", t);
  }
  applyStoredTheme();
  themeBtn.addEventListener("click", function () {
    var current = document.documentElement.getAttribute("data-theme");
    var next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("mojo-deck-theme", next); } catch (err) {}
  });

  render();
})();
</script>
